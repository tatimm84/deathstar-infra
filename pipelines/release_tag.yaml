trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  MAJOR_MINOR: "1.0"

steps:
  - checkout: self
    persistCredentials: true # Necessário para push do git

  - bash: |
      set -e
      # Calcula versão patch baseado no BuildId ou contador
      TAG_NAME="v$(MAJOR_MINOR).$(Build.BuildId)"
      
      echo "Criando tag $TAG_NAME..."
      git tag $TAG_NAME
      git push origin $TAG_NAME
      
      echo "##vso[task.setvariable variable=ReleaseTag]$TAG_NAME"
    displayName: "Criar e publicar Git Tag"
