[project]
name = "deathstar-infra"
version = "1.0.0"
description = "GCP Infrastructure as Code using Pulumi"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-docker>=4.0.0,<5.0.0",
    "pulumi-gcp>=9.0.0,<10.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.0.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# UV-specific configuration
dev-dependencies = []

[tool.hatch.build.targets.wheel]
# Include all Python files in the current directory
packages = ["."]

[tool.pulumi]
# Pulumi toolchain configuration
toolchain = "uv"
